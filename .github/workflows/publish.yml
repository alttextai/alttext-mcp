name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      - name: Install Redis for integration tests
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: npm ci
      - run: npm run version:stamp
      - name: Fail on version drift
        run: git diff --exit-code
      - name: Check the tag matches the root version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${version}"
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Install the OIDC-capable npm CLI
        run: npm install --global npm@11.21.3
      - name: Publish and verify the MCP server and CLI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          for workspace in packages/mcp packages/cli; do
            npm run prepack --workspace "$workspace"
            pack=$(npm pack --json --ignore-scripts --workspace "$workspace" --pack-destination "$RUNNER_TEMP" |
              jq -ce 'if length == 1 then first(.[]) else error("expected one packed package") end')
            package=$(jq -er '.name' <<< "$pack")
            tarball="$RUNNER_TEMP/$(jq -er '.filename' <<< "$pack")"
            expected=$(jq -er '.integrity' <<< "$pack")
            existing=$(npm view "${package}@${version}" dist.integrity --prefer-online --fetch-retries=0 --fetch-timeout=10000) || existing=""
            if [ -z "$existing" ]; then
              npm publish "$tarball" --provenance --access public
            elif [ "$existing" != "$expected" ]; then
              echo "::error::${package}@${version} exists with different package contents."
              exit 1
            fi
            for attempt in 1 2 3 4 5; do
              actual=$(npm view "${package}@${version}" dist.integrity --prefer-online --fetch-retries=0 --fetch-timeout=10000) || actual=""
              if [ "$actual" = "$expected" ]; then break; fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Registry did not return the expected package integrity for ${package}@${version}."
                exit 1
              fi
              sleep 5
            done
          done
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
